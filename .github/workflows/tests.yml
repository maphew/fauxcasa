# Parser test suite (scripts/test_picasa_db.py). Oracle-cache integration
# tests self-skip when cache/ is absent; the committed differential
# fixtures (fixtures/oracle/) DO run here — the golden-fixture fallback
# posture of spec §4.
#
# ingest-parity is the M1 gate clause 2 (spec §9): the picasa_db survey
# cross-check must show zero ingest loss vs the tracer's scan_library on
# a synthetic picasa-extras corpus (fauxcasa-ed5.1/.2). It runs on every
# push — unconditionally, not path-filtered — because it spans scripts/
# AND apps/desktop-python/catalog.py, and the ratchet must fire the
# moment fauxcasa-cam.* ingest work lands anywhere.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  delegation-report:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/test_delegation_report.py -q

  picasa-db:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/test_picasa_db.py -q

  ingest-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: M1 gate — survey/tracer ingest-parity cross-check
        run: uv run scripts/check-ingest-parity.py

  # perf-canary is the §7 CI slice (fauxcasa-ed5.3): cold-start assert,
  # search-latency probe, catalog-size report, parsed from the tracer's
  # READY/JSON stdout protocol on the 24-photo deterministic corpus.
  #
  # HONEST SCOPE: these thresholds are CANARIES, not the §7 budgets. The
  # budgets (cold start < 2 s, search < 50 ms) are defined at 100k photos
  # on reference hardware; shared CI runners at 24 photos can only catch
  # order-of-magnitude regressions (a synchronous rescan on the warm path,
  # per-keystroke IO, a quadratic filter scan). The definitive 100k numbers
  # stay dev-box measurements recorded in beads fauxcasa-ed5.4/.3. The
  # catalog-size row is REPORTED, not asserted at ~50 B/photo — that row
  # has a known tension (sha256-bearing JSON rows; fauxcasa-1jb); only a
  # generous runaway-growth ceiling fails. Thresholds + contract live in
  # scripts/perf-canary.py. Windows runs per §8 (§7 gates run in Windows CI).
  perf-canary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Qt offscreen system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
      - name: §7 perf canaries — cold start, search latency, catalog size
        run: uv run scripts/perf-canary.py

  # decode-sandbox is the i92.3 suite (design doc §7 gates 1/3/5). On
  # windows-latest the containment/escape gates spawn REAL AppContainer
  # workers — a failing gate there is a security finding, not flakiness.
  # On ubuntu the Windows-only tests self-skip and the platform-independent
  # pieces (trusted-side protocol fuzz, hello/lockdown parsing) still run,
  # so the broker's own validation code can't regress silently on any OS.
  decode-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Qt offscreen system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
      # TEMPORARY (remove once the GHA windows spawn failure is diagnosed):
      # spike says full lockdown is viable on this runner, so the delta is
      # location-shaped. Bisect the broker CWD (D:\a checkout, runner-only
      # ACLs, inherited by the child) vs a world-readable C: temp cwd, and
      # dump the ACLs the spawn-time grants actually produced.
      - name: DEBUG spawn cwd bisect (windows only, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          uv run --with PySide6 python - <<'PYEOF'
          import os, subprocess, sys, tempfile
          repo = os.getcwd()
          sys.path.insert(0, os.path.join(repo, "apps", "desktop-python"))
          import decodesvc_win as dw
          for label, cwd in [("cwd-repo-D", repo), ("cwd-temp-C", tempfile.gettempdir())]:
              os.chdir(cwd)
              try:
                  w = dw.WinSandboxWorker(arena_bytes=8 * 1024 * 1024, probe=True)
                  w.spawn()
                  print(label, "SPAWN-OK", flush=True)
                  w.close()
              except Exception as e:
                  print(label, "SPAWN-FAIL", repr(e)[:400], flush=True)
          os.chdir(repo)
          wp, site = dw.resolve_worker_python()
          for p in (repo, os.path.join(repo, "apps", "desktop-python"),
                    site, os.path.dirname(wp)):
              print("== icacls", p, flush=True)
              subprocess.run(["icacls", p], check=False)
          PYEOF
        env:
          QT_QPA_PLATFORM: offscreen
      - name: i92.3 sandbox escape gates (win) + trusted-side fuzz (all)
        run: uv run apps/desktop-python/test_decodesvc_win.py -q
        env:
          QT_QPA_PLATFORM: offscreen
