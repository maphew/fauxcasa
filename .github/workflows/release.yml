# Release workflow (fauxcasa-ez2.7). Builds the SAME pinned PyInstaller
# bundle bundle.yml gates on tracer pushes, but on a version tag: stamps
# git sha/build date into the artifact, runs the full bundle.yml smoke
# gate set (plus a real-xcb exercise on Linux), packages the shipping
# (console=False) dist/fauxcasa bundle into a per-OS archive, and cuts a
# DRAFT GitHub release with checksums and build provenance attestation for
# the owner to review before publishing.
#
# DRY RUN (no push required to try the workflow logic):
#   git tag v0.1.0-rc1 && git push origin v0.1.0-rc1
#   gh workflow run release.yml -f tag=v0.1.0-rc1
#   (workflow_dispatch does NOT push a tag itself — the tag must already
#   exist on the remote, e.g. from the `git push` above, since gh release
#   create/--generate-notes and the provenance attestation both need a
#   real tag ref.)
#
# CLEANUP after a dry run:
#   gh release delete v0.1.0-rc1 --yes          # drop the draft release
#   git push --delete origin v0.1.0-rc1         # drop the remote tag
#   git tag -d v0.1.0-rc1                       # drop the local tag
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-rc1) — must already exist on the remote"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Explicit runners, NOT ubuntu-latest/windows-latest: the Linux
        # tarball is a real shipping artifact (unlike bundle.yml's
        # CI-evidence-only onedir), so it needs a pinned glibc floor
        # (2.35, Ubuntu 22.04) rather than whatever -latest rolls to next.
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      # Interpreter pin: without it `uv run` takes the runner's default
      # CPython, which differs per image (ubuntu-22.04 ships 3.10 and the
      # av==18 wheel needs >=3.11, so the first dry run failed to resolve;
      # windows-2022 happened to use 3.12). 3.12 is what the passing
      # Windows leg built with. Bump deliberately, in lockstep with
      # bundle.yml.
      UV_PYTHON: "3.12"
      # Pins copied VERBATIM from .github/workflows/bundle.yml — bundle.yml
      # is the source of truth; if these drift out of sync the release
      # artifact and the CI-gated artifact stop being the same build.
      PYSIDE6: "PySide6-Essentials==6.11.1"
      PYSIDE6_ADDONS: "PySide6-Addons==6.11.1"
      PYINSTALLER: "pyinstaller==6.20.0"
      EXIV2: "exiv2==0.18.1"
      PILLOW: "pillow==12.3.0"
      RAWPY: "rawpy==0.27.0"
      AV: "av==18.0.0"
      ZSTD: "zstandard==0.23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Resolve tag/version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VER="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Releasing tag=$TAG version=$VER"

      - name: Linux runtime libs (offscreen set + xcb runtime set)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libegl1..libpulse0: same offscreen set bundle.yml installs
          # (PySide6 wheels link system GL/EGL; libpulse0 for QtMultimedia).
          # libxcb-cursor0..xvfb: additional runtime the release job needs
          # ONLY here, to exercise the real xcb platform plugin (not
          # offscreen) via xvfb-run below.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 xvfb

      - name: Assert tag matches __version__
        shell: bash
        run: |
          # A pre-release suffix (v0.1.0-rc1, v0.1.0-beta2) is allowed for
          # dry runs and release candidates: only the part before the
          # first '-' must equal __version__. Archives keep the full VER.
          BASE="${VER%%-*}"
          if ! grep -q "^__version__ = \"${BASE}\"\$" apps/desktop-python/main.py; then
            echo "::error::tag ${TAG} (version ${BASE}) does not match __version__ in apps/desktop-python/main.py"
            grep -n "^__version__" apps/desktop-python/main.py || true
            exit 1
          fi
          echo "OK: tag ${TAG} matches __version__ = \"${BASE}\""

      - name: Write build stamp (_buildinfo.py)
        shell: bash
        run: |
          GIT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          cat > apps/desktop-python/_buildinfo.py <<EOF
          # Generated by .github/workflows/release.yml — DO NOT COMMIT.
          GIT_SHA = "${GIT_SHA}"
          BUILD_DATE = "${BUILD_DATE}"
          EOF
          echo "GIT_SHA=${GIT_SHA} BUILD_DATE=${BUILD_DATE}"
          cat apps/desktop-python/_buildinfo.py

      - name: Build both bundles (onedir, console + windowed, Essentials, pinned)
        # SAME invocation as bundle.yml's "Build both bundles" step — keep
        # them in lockstep by hand; do not let this drift.
        run: >
          uv run --with "${{ env.PYSIDE6 }}" --with "${{ env.PYSIDE6_ADDONS }}"
          --with "${{ env.PYINSTALLER }}"
          --with "${{ env.RAWPY }}" --with "${{ env.EXIV2 }}"
          --with "${{ env.PILLOW }}" --with "${{ env.AV }}" --with "${{ env.ZSTD }}"
          pyinstaller --noconfirm --clean apps/desktop-python/fauxcasa-tracer.spec

      - name: Frozen lazy-dependency self-check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-console/fauxcasa-console.exe"
          else
            EXE="dist/fauxcasa-console/fauxcasa-console"
          fi
          "$EXE" --bundle-self-check

      - name: Generate a smoke library (JPEG fixtures + synthetic DNG)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          from pathlib import Path
          from PySide6.QtGui import QColor, QImage
          root = Path("ci-library")
          for folder, n in [("2019-03-02 Hike", 6), ("2022-11-20 Birthday", 4)]:
              d = root / folder
              d.mkdir(parents=True)
              for i in range(n):
                  img = QImage(320, 240, QImage.Format.Format_RGB32)
                  # blue-dominant fill (g=90, b=160). The non-blank assert
                  # step keys on exactly this palette — keep them in sync.
                  img.fill(QColor(40 * i % 255, 90, 160))
                  assert img.save(str(d / f"photo{i:02d}.jpg"), "JPEG", 85)
          (root / "2019-03-02 Hike" / ".picasa.ini").write_text(
              "[photo01.jpg]\r\nstar=yes\r\ncaption=summit\r\n")
          print("ci-library ready")
          EOF
          # Pre-committed synthetic DNG (fauxcasa-v46.5): gates the RAW
          # decode path (rawpy hidden-import) in the frozen artifact.
          cp fixtures/raw-smoke/synthetic.dng "ci-library/2019-03-02 Hike/"

      - name: Smoke-run the FROZEN artifact headless (the whole point)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-console/fauxcasa-console.exe"
          else
            EXE="dist/fauxcasa-console/fauxcasa-console"
          fi
          "$EXE" ci-library --cache-root ./ci-cache --finish-build \
            --screenshot frozen-ci.png --scroll-to 0.5

      - name: Assert the screenshot is non-blank (qjpeg actually decoded)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          import sys
          from collections import Counter
          from PySide6.QtGui import QImage
          img = QImage("frozen-ci.png")
          if img.isNull():
              sys.exit("screenshot did not load")
          c = Counter()
          for y in range(0, img.height(), 5):
              for x in range(0, img.width(), 5):
                  p = img.pixelColor(x, y)
                  c[(p.red() // 32 * 32, p.green() // 32 * 32, p.blue() // 32 * 32)] += 1
          blue = sum(n for (r, g, b), n in c.items() if b >= 128 and b > g and g >= 64)
          print(f"blue-photo samples: {blue}")
          if blue < 50:
              sys.exit("BLANK grid — JPEG tiles did not decode (qjpeg missing?)")
          print("OK: frozen artifact decodes JPEG thumbnails")
          EOF

      - name: Smoke-run the FROZEN artifact's viewer (--open, the DNG)
        # SAME leg as bundle.yml's "Smoke-run the FROZEN artifact's viewer"
        # step — see that comment for why --open 6 is the synthetic DNG.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-console/fauxcasa-console.exe"
          else
            EXE="dist/fauxcasa-console/fauxcasa-console"
          fi
          "$EXE" ci-library --cache-root ./open-cache --finish-build \
            --open 6 --screenshot frozen-open.png

      - name: Assert the viewer screenshot is non-blank (DNG decoded to pixels)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          import sys
          from collections import Counter
          from PySide6.QtGui import QImage
          img = QImage("frozen-open.png")
          if img.isNull():
              sys.exit("viewer screenshot did not load")
          c = Counter()
          for y in range(0, img.height(), 5):
              for x in range(0, img.width(), 5):
                  p = img.pixelColor(x, y)
                  c[(p.red() // 32 * 32, p.green() // 32 * 32, p.blue() // 32 * 32)] += 1
          blue = sum(n for (r, g, b), n in c.items() if b >= 128 and b > g and g >= 64)
          print(f"blue-photo samples: {blue}")
          if blue < 50:
              sys.exit("BLANK viewer — DNG did not decode (rawpy missing?)")
          print("OK: frozen artifact's viewer decodes the DNG")
          EOF

      - name: Assert DNG thumbnail decoded in frozen artifact (rawpy gated)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          import json, struct, sys
          from pathlib import Path

          cache_root = Path("ci-cache")
          if not cache_root.exists():
              sys.exit("ci-cache not found — smoke run may have failed")

          dng_found = False
          for d in sorted(cache_root.iterdir()):
              if not d.is_dir():
                  continue
              fc = d / "thumbs.fcache"
              fj = d / "thumbs.fcache.json"
              if not fc.exists() or not fj.exists():
                  continue
              meta = json.loads(fj.read_text())
              files = meta.get("files", [])
              dng_files = [f for f in files if f.lower().endswith(".dng")]
              if not dng_files:
                  continue
              idx = files.index(dng_files[0])
              raw_data = fc.read_bytes()
              if raw_data[:4] != b"FCTC":
                  sys.exit(f"Bad fcache magic: {raw_data[:4]!r}")
              version = struct.unpack_from("<I", raw_data, 4)[0]
              if version != 1:
                  sys.exit(f"Unexpected fcache version {version}")
              entry_off = 16 + idx * 16
              offset, length, w, h = struct.unpack_from("<QIHH", raw_data,
                                                        entry_off)
              if length == 0:
                  sys.exit(
                      "DNG decoded to error tile (rawpy/hiddenimport missing?)"
                      f" — {dng_files[0]}"
                  )
              print(f"OK: DNG thumb decoded ({w}x{h}, {length} bytes) "
                    "— rawpy bundled correctly")
              dng_found = True
              break

          if not dng_found:
              sys.exit("DNG not found in ci-cache — was it indexed?")
          EOF

      - name: Frozen no-arg launch fails GRACEFULLY (shipping double-click UX)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-console/fauxcasa-console.exe"
          else
            EXE="dist/fauxcasa-console/fauxcasa-console"
          fi
          set +e
          OUT=$("$EXE" --cache-root ./noarg-cache 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "exit=$RC"
          if [ "$RC" -ne 2 ]; then
            echo "::error::expected graceful exit 2, got $RC"; exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -q "no library selected"; then
            echo "::error::missing the friendly no-library message"; exit 1
          fi
          if printf '%s\n' "$OUT" | grep -qi "traceback"; then
            echo "::error::crashed instead of exiting gracefully"; exit 1
          fi
          echo "OK: frozen no-arg launch exits gracefully"

      - name: Windowed (console=False) build logs instead of printing (fauxcasa-pqw)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa/fauxcasa.exe"
          else
            EXE="dist/fauxcasa/fauxcasa"
          fi
          set +e
          "$EXE" ci-library --cache-root ./gui-cache --finish-build \
            --screenshot gui-ci.png --scroll-to 0.5
          RC=$?
          set -e
          echo "exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::windowed build exited $RC (expected 0)"; exit 1
          fi
          if [ ! -s gui-ci.png ]; then
            echo "::error::windowed build produced no screenshot"; exit 1
          fi
          LOG=$(ls ./gui-cache/*.log 2>/dev/null | head -n1 || true)
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
            echo "::error::no log file (./gui-cache/*.log) — a console=False build's diagnostics would be lost"; exit 1
          fi
          echo "----- $LOG -----"; cat "$LOG"
          if ! grep -Eq "photos,.*folders,.*albums" "$LOG"; then
            echo "::error::log file is missing the startup status line"; exit 1
          fi
          echo "OK: windowed build is silent on stdout/stderr but logged to $LOG"

      - name: Real xcb plugin smoke (Linux, release-only)
        # bundle.yml's gates all run under QT_QPA_PLATFORM=offscreen — this
        # additional leg exercises the actual xcb platform plugin end users
        # get, via xvfb, so the release artifact proves it can open a real
        # (virtual) X display, not just the offscreen fallback.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unset QT_QPA_PLATFORM
          set +e
          xvfb-run -a dist/fauxcasa/fauxcasa ci-library --cache-root ./xcb-cache \
            --finish-build --screenshot xcb-ci.png
          RC=$?
          set -e
          echo "exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::real-xcb run exited $RC (expected 0)"; exit 1
          fi
          if [ ! -s xcb-ci.png ]; then
            echo "::error::real-xcb run produced no screenshot"; exit 1
          fi
          echo "OK: real xcb plugin renders under xvfb"

      - name: Stage release payload (LICENSE, notices, README)
        shell: bash
        run: |
          if [ -f THIRD-PARTY-NOTICES.md ]; then
            cp THIRD-PARTY-NOTICES.md dist/fauxcasa/
          else
            echo "::warning::THIRD-PARTY-NOTICES.md not found (PR 117 adds it) — shipping a placeholder"
            echo "Third-party notices: TODO — see THIRD-PARTY-NOTICES.md in a later release." \
              > dist/fauxcasa/THIRD-PARTY-NOTICES.md
          fi
          cp LICENSE dist/fauxcasa/
          # Notes are written per release VERSION, not per tag: a v0.1.0-rc1
          # dry run reads docs/releases/v0.1.0.md (same rule as the assert).
          NOTES="docs/releases/v${VER%%-*}.md"
          if [ -f "$NOTES" ]; then
            if uv run --with markdown python -m markdown "$NOTES" > dist/fauxcasa/README.html; then
              echo "OK: rendered README.html from $NOTES"
            else
              echo "::warning::markdown render failed — falling back to raw copy"
              cp "$NOTES" dist/fauxcasa/README.md
            fi
          else
            echo "::warning::$NOTES not found — shipping without a README"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/fauxcasa/* -DestinationPath "fauxcasa-${env:VER}-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf "fauxcasa-${VER}-linux-x64.tar.gz" fauxcasa

      - uses: actions/upload-artifact@v4
        with:
          name: fauxcasa-${{ matrix.os }}
          path: |
            fauxcasa-*-windows-x64.zip
            fauxcasa-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag/version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VER="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd release-assets
          ls -la
          sha256sum fauxcasa-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/fauxcasa-*.zip
            release-assets/fauxcasa-*.tar.gz

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          NOTES="../docs/releases/v${VER%%-*}.md"   # per version, not per tag
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --draft --prerelease \
              --title "Fauxcasa ${VER} - See your library again" \
              --notes-file "$NOTES" \
              fauxcasa-* SHA256SUMS
          else
            echo "::warning::$NOTES not found — using --generate-notes"
            gh release create "$TAG" --draft --prerelease \
              --title "Fauxcasa ${VER} - See your library again" \
              --generate-notes \
              fauxcasa-* SHA256SUMS
          fi
