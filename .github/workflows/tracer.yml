# Tracer bullet app (fauxcasa-pzx): tests + a real end-to-end headless
# run on Linux AND Windows — same "green builds from day one" evidence
# rule as the balloons (spec §10). The smoke library is generated in CI;
# the repo's cache/ fixtures are machine-local.
name: tracer

on:
  push:
    paths:
      - "apps/desktop-python/**"
      - "scripts/make-thumbcache.py"
      - "scripts/picasa_db.py"
      - "scripts/fetch-test-datasets.py"
      - ".github/workflows/tracer.yml"
  pull_request:
    paths:
      - "apps/desktop-python/**"
      - "scripts/make-thumbcache.py"
      - "scripts/picasa_db.py"
      - "scripts/fetch-test-datasets.py"
      - ".github/workflows/tracer.yml"
  workflow_dispatch:

jobs:
  tracer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung suite (the gfz-family Windows flake, fauxcasa-ed5.12) must not
    # burn a 6-hour runner; the suite normally finishes in ~1 minute.
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Linux runtime libs (PySide6 wheels link system GL/EGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Fetch the IPTC reference set (tiny)
        # Third-party host: an iptc.org outage must not redden every PR.
        # Without the .fetch-complete marker the dataset tests self-skip.
        continue-on-error: true
        run: uv run scripts/fetch-test-datasets.py iptc-reference
      - name: Dataset-gated metadata tests
        run: uv run apps/desktop-python/test_inmeta_datasets.py -q
      - name: Unit tests (one pytest process per file)
        run: uv run apps/desktop-python/test_tracer.py
      - name: Generate a smoke library
        shell: bash
        run: |
          uv run --with PySide6 python - <<'EOF'
          from pathlib import Path
          from PySide6.QtGui import QColor, QImage
          root = Path("ci-library")
          for folder, n in [("2019-03-02 Hike", 6), ("2022-11-20 Birthday", 4)]:
              d = root / folder
              d.mkdir(parents=True)
              for i in range(n):
                  img = QImage(320, 240, QImage.Format.Format_RGB32)
                  img.fill(QColor(40 * i % 255, 90, 160))
                  assert img.save(str(d / f"photo{i:02d}.jpg"), "JPEG", 85)
          (root / "2019-03-02 Hike" / ".picasa.ini").write_text(
              "[photo01.jpg]\r\nstar=yes\r\ncaption=summit\r\n")
          EOF
      - name: End-to-end headless run (scan, build cache, grid, screenshot)
        run: >
          uv run apps/desktop-python/main.py ci-library --finish-build
          --screenshot tracer-ci.png --scroll-to 0.5
      - name: Warm second run binds the built cache
        run: uv run apps/desktop-python/main.py ci-library --quit-after-ready
      - name: Decode-sandbox e2e (Windows, real AppContainer, source run)
        # fauxcasa-ez2.9 Stage 2: proves the sandbox on a source run under
        # the actual production default (sandbox_mode() defaults to "1" on
        # win32 outside pytest -- this is main.py directly, not the pinned-
        # off pytest suite above). --require-sandbox makes a failed hello
        # a hard CI failure here (unlike bundle.yml/release.yml's frozen
        # go/no-go, which is continue-on-error): a real windows-latest
        # runner failing to sandbox from SOURCE is a regression, not the
        # frozen-artifact go/no-go's softer "ship degraded" case.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          OUT=$(uv run apps/desktop-python/main.py ci-library \
            --cache-root ./sbx-cache --finish-build --require-sandbox \
            --quit-after-ready 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::--require-sandbox source run exited $RC"; exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep '"event": "decode-sandbox"' \
              | grep -q '"state": "sandboxed"'; then
            echo "::error::missing {\"event\": \"decode-sandbox\", \"state\": \"sandboxed\", ...} in stdout"
            exit 1
          fi
          echo "OK: source run's decode sandbox hellos (state=sandboxed)"
      - name: Decode-sandbox e2e (Windows, wired call sites, real AppContainer)
        # fauxcasa-ez2.9 Stage 2 review P2-5: the source run above proves
        # the sandbox STARTS on this runner; this proves thumbcache.
        # _index_one and viewer.load_original_oriented actually ROUTE
        # through it (parity + hostile-file taxonomy) against a real
        # worker, not a stub -- the one suite that was previously wired
        # into nothing (test_sandbox_e2e.py module docstring).
        if: runner.os == 'Windows'
        run: uv run apps/desktop-python/test_sandbox_e2e.py -q
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: tracer-screenshot-${{ matrix.os }}
          path: tracer-ci.png
