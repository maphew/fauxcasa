# Windows packaging spike (fauxcasa-ncv, an M1 tripwire from the stack
# decision fauxcasa-6hf). Builds a REAL PyInstaller distributable of the
# tracer so the §7/N gates can run on "the artifact users would get", not
# on source. Windows is THE gating artifact; the Ubuntu build is cheap
# early-warning for PyInstaller/PySide6 hook regressions (a Linux
# PyInstaller onedir is glibc-pinned to the runner, so it is CI evidence,
# not a shipping Linux product). Size is a SOFT gate — §7 anchors austerity
# on resident memory + cold start, not installer megabytes.
name: bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop-python/**"
      - "scripts/picasa_db.py"
      - "scripts/make-synthetic-dng.py"
      - "fixtures/raw-smoke/**"
      - ".github/workflows/bundle.yml"
  pull_request:
    paths:
      - "apps/desktop-python/**"
      - "scripts/picasa_db.py"
      - "scripts/make-synthetic-dng.py"
      - "fixtures/raw-smoke/**"
      - ".github/workflows/bundle.yml"

jobs:
  bundle:
    strategy:
      fail-fast: false      # a Linux break must still yield the Windows artifact
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # pinned so a new PySide6/PyInstaller release can't silently change
      # the gated artifact under us (graduate to a lockfile for a release gate)
      PYSIDE6: "PySide6-Essentials==6.11.1"
      # Addons carries QtMultimedia, needed ONLY for QAudioSink (video
      # playback audio, fauxcasa-v46.3) — Essentials alone builds green
      # but ships a silently MUTE artifact (viewer._make_audio_sink
      # guards the import). Keep in lockstep with PYSIDE6; the spec's
      # binary filter strips every Qt media DECODE backend (i92.1).
      PYSIDE6_ADDONS: "PySide6-Addons==6.11.1"
      PYINSTALLER: "pyinstaller==6.20.0"
      # Metadata reader and still fallback are lazy imports too. Omitting
      # either from the build environment produces a green PyInstaller run
      # but silently drops dates/GPS/ratings or PSD fallback at runtime.
      EXIV2: "exiv2==0.18.1"
      PILLOW: "pillow==12.3.0"
      # LibRaw as a wheel (fauxcasa-v46.1): the artifact must bundle RAW
      # decode — rawpy is imported lazily (rawload.py), so a build without
      # it "succeeds" and ships error tiles for every RAW. Pinned like the
      # others; bump deliberately (it vendors libraw — §6 footgun 14 says
      # UPDATE it, on purpose, not by accident).
      RAWPY: "rawpy==0.27.0"
      # libav as a wheel (fauxcasa-v46.2, decode-service §3c: PyAV, NOT an
      # ffmpeg subprocess): the artifact must bundle video poster decode —
      # av is imported lazily (videoload.py), so a build without it
      # "succeeds" and ships error tiles for every video. Same deliberate-
      # bump rule as rawpy (it vendors ffmpeg's libs).
      AV: "av==18.0.0"
      # zstd catalog compression (fauxcasa-ed5.5): catalog.py's
      # save_catalog/load_catalog import zstandard lazily, so a build
      # environment without it "succeeds" but the frozen artifact raises
      # ImportError on the very first launch (load_catalog is called
      # unconditionally). Pinned/deliberate-bump like the others.
      ZSTD: "zstandard==0.23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Linux runtime libs (PySide6 wheels link system GL/EGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpulse0: libQt6Multimedia.so.6 hard-links libpulse.so.0, so the
          # frozen self-check's `import PySide6.QtMultimedia` needs it on the
          # runner (fauxcasa-v46.3). End-user machines without it degrade to
          # silent video via the guarded viewer._make_audio_sink, not a crash.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libpulse0

      - name: Build both bundles (onedir, console + windowed, Essentials, pinned)
        # One Analysis -> dist/fauxcasa-tracer (console=True, CI/smoke) AND
        # dist/fauxcasa-tracer-gui (console=False, shipping). See fauxcasa-pqw.
        run: >
          uv run --with "${{ env.PYSIDE6 }}" --with "${{ env.PYSIDE6_ADDONS }}"
          --with "${{ env.PYINSTALLER }}"
          --with "${{ env.RAWPY }}" --with "${{ env.EXIV2 }}"
          --with "${{ env.PILLOW }}" --with "${{ env.AV }}" --with "${{ env.ZSTD }}"
          pyinstaller --noconfirm --clean apps/desktop-python/fauxcasa-tracer.spec

      - name: Frozen lazy-dependency self-check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer.exe"
          else
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer"
          fi
          "$EXE" --bundle-self-check

      - name: Generate a smoke library (JPEG fixtures + synthetic DNG)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          from pathlib import Path
          from PySide6.QtGui import QColor, QImage
          root = Path("ci-library")
          for folder, n in [("2019-03-02 Hike", 6), ("2022-11-20 Birthday", 4)]:
              d = root / folder
              d.mkdir(parents=True)
              for i in range(n):
                  img = QImage(320, 240, QImage.Format.Format_RGB32)
                  # blue-dominant fill (g=90, b=160). The non-blank assert
                  # step keys on exactly this palette — keep them in sync.
                  img.fill(QColor(40 * i % 255, 90, 160))
                  assert img.save(str(d / f"photo{i:02d}.jpg"), "JPEG", 85)
          (root / "2019-03-02 Hike" / ".picasa.ini").write_text(
              "[photo01.jpg]\r\nstar=yes\r\ncaption=summit\r\n")
          print("ci-library ready")
          EOF
          # Add the pre-committed synthetic DNG (fauxcasa-v46.5): gates the
          # RAW decode path (rawpy hidden-import) in the frozen artifact.
          # Blue JPEG preview matches the existing blue-dominant palette;
          # a dedicated assertion step below checks the tile is non-blank.
          cp fixtures/raw-smoke/synthetic.dng "ci-library/2019-03-02 Hike/"

      - name: Smoke-run the FROZEN artifact headless (the whole point)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer.exe"
          else
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer"
          fi
          # explicit library + --cache-root: the frozen __file__-relative
          # defaults point inside the (read-only) bundle.
          "$EXE" ci-library --cache-root ./ci-cache --finish-build \
            --screenshot frozen-ci.png --scroll-to 0.5

      - name: Assert the screenshot is non-blank (qjpeg actually decoded)
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          import sys
          from collections import Counter
          from PySide6.QtGui import QImage
          img = QImage("frozen-ci.png")
          if img.isNull():
              sys.exit("screenshot did not load")
          c = Counter()
          for y in range(0, img.height(), 5):
              for x in range(0, img.width(), 5):
                  p = img.pixelColor(x, y)
                  c[(p.red() // 32 * 32, p.green() // 32 * 32, p.blue() // 32 * 32)] += 1
          # Keyed on the smoke-library fill above (QColor(40*i%255, 90, 160)):
          # the fixtures are blue-dominant (g~90, b~160), so a decoded grid has
          # many b>=128, b>g samples. A blank grid is only background/placeholder
          # grays => qjpeg missing. If that fill palette changes, update this.
          blue = sum(n for (r, g, b), n in c.items() if b >= 128 and b > g and g >= 64)
          print(f"blue-photo samples: {blue}")
          if blue < 50:
              sys.exit("BLANK grid — JPEG tiles did not decode (qjpeg missing?)")
          print("OK: frozen artifact decodes JPEG thumbnails")
          EOF

      - name: Assert DNG thumbnail decoded in frozen artifact (rawpy gated)
        # Mirrors the JPEG tile assertion above but keys on the fcache directly
        # rather than the screenshot: checks that the synthetic.dng entry has a
        # nonzero tile length, proving rawpy is bundled (fauxcasa-v46.5, #45).
        shell: bash
        run: |
          uv run --with "${{ env.PYSIDE6 }}" python - <<'EOF'
          import json, struct, sys
          from pathlib import Path

          cache_root = Path("ci-cache")
          if not cache_root.exists():
              sys.exit("ci-cache not found — smoke run may have failed")

          dng_found = False
          for d in sorted(cache_root.iterdir()):
              if not d.is_dir():
                  continue
              fc = d / "thumbs.fcache"
              fj = d / "thumbs.fcache.json"
              if not fc.exists() or not fj.exists():
                  continue
              meta = json.loads(fj.read_text())
              files = meta.get("files", [])
              dng_files = [f for f in files if f.lower().endswith(".dng")]
              if not dng_files:
                  continue
              idx = files.index(dng_files[0])
              raw_data = fc.read_bytes()
              # v1 fcache: 16-byte header (FCTC + version + count + reserved),
              # then count*16 index entries (offset:Q, length:I, w:H, h:H).
              if raw_data[:4] != b"FCTC":
                  sys.exit(f"Bad fcache magic: {raw_data[:4]!r}")
              version = struct.unpack_from("<I", raw_data, 4)[0]
              if version != 1:
                  sys.exit(f"Unexpected fcache version {version}")
              entry_off = 16 + idx * 16
              offset, length, w, h = struct.unpack_from("<QIHH", raw_data,
                                                        entry_off)
              if length == 0:
                  sys.exit(
                      "DNG decoded to error tile (rawpy/hiddenimport missing?)"
                      f" — {dng_files[0]}"
                  )
              print(f"OK: DNG thumb decoded ({w}x{h}, {length} bytes) "
                    "— rawpy bundled correctly")
              dng_found = True
              break

          if not dng_found:
              sys.exit("DNG not found in ci-cache — was it indexed?")
          EOF

      - name: Frozen no-arg launch fails GRACEFULLY (shipping double-click UX)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer.exe"
          else
            EXE="dist/fauxcasa-tracer/fauxcasa-tracer"
          fi
          # No library + a fresh empty cache => nothing remembered. Under
          # offscreen the first-run folder picker can't prompt, so the app
          # must exit 2 with a friendly message — never hang on a modal
          # dialog or dump a traceback. Guards the fauxcasa-9cz frozen UX
          # (the no-arg path the explicit-library smoke above never hits).
          set +e
          OUT=$("$EXE" --cache-root ./noarg-cache 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "exit=$RC"
          if [ "$RC" -ne 2 ]; then
            echo "::error::expected graceful exit 2, got $RC"; exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -q "no library selected"; then
            echo "::error::missing the friendly no-library message"; exit 1
          fi
          if printf '%s\n' "$OUT" | grep -qi "traceback"; then
            echo "::error::crashed instead of exiting gracefully"; exit 1
          fi
          echo "OK: frozen no-arg launch exits gracefully"

      - name: Frozen no-arg launch with NO display env exits gracefully (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXE="dist/fauxcasa-tracer/fauxcasa-tracer"
          # The shipping double-click failure mode on a headless or
          # misconfigured Linux box: QT_QPA_PLATFORM, DISPLAY and
          # WAYLAND_DISPLAY ALL UNSET, so Qt falls back to the default 'xcb'
          # plugin with no display to connect to. Before fauxcasa-7e5 that made
          # QApplication([]) call qFatal/abort (exit 134) BEFORE the offscreen
          # platformName guard could run; the new pre-construction
          # _gui_unavailable() guard must instead reach the friendly exit 2.
          # The offscreen step above never exercises this path — it always has
          # a (headless) platform set, so QApplication never aborts there.
          unset QT_QPA_PLATFORM DISPLAY WAYLAND_DISPLAY
          set +e
          OUT=$("$EXE" --cache-root ./noarg-nodisplay-cache 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "exit=$RC"
          if [ "$RC" -eq 134 ]; then
            echo "::error::aborted (134) in QApplication — the headless guard regressed"; exit 1
          fi
          if [ "$RC" -ne 2 ]; then
            echo "::error::expected graceful exit 2 with no display, got $RC"; exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -q "no library selected"; then
            echo "::error::missing the friendly no-library message"; exit 1
          fi
          if printf '%s\n' "$OUT" | grep -qi "traceback"; then
            echo "::error::crashed instead of exiting gracefully"; exit 1
          fi
          echo "OK: frozen no-arg launch with no display exits gracefully"

      - name: Windowed (console=False) build logs instead of printing (fauxcasa-pqw)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/fauxcasa-tracer-gui/fauxcasa-tracer-gui.exe"
          else
            EXE="dist/fauxcasa-tracer-gui/fauxcasa-tracer-gui"
          fi
          # The shipping double-click build. A windowed PyInstaller process has
          # sys.stdout/sys.stderr == None (no console — most starkly on
          # Windows), so the console smoke above CANNOT be repeated here:
          # nothing reaches the streams. The rotating log file applog writes IS
          # the diagnostic of record, so this leg proves the no-console path —
          # a real screenshot still lands AND the always-on startup status line
          # reached the log file. Without applog these diagnostics would
          # silently vanish in a console=False build.
          set +e
          "$EXE" ci-library --cache-root ./gui-cache --finish-build \
            --screenshot gui-ci.png --scroll-to 0.5
          RC=$?
          set -e
          echo "exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::windowed build exited $RC (expected 0)"; exit 1
          fi
          if [ ! -s gui-ci.png ]; then
            echo "::error::windowed build produced no screenshot"; exit 1
          fi
          LOG="./gui-cache/fauxcasa-tracer.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::no log file ($LOG) — a console=False build's diagnostics would be lost"; exit 1
          fi
          echo "----- $LOG -----"; cat "$LOG"
          if ! grep -Eq "photos,.*folders,.*albums" "$LOG"; then
            echo "::error::log file is missing the startup status line"; exit 1
          fi
          echo "OK: windowed build is silent on stdout/stderr but logged to $LOG"

      - name: Bundle size (soft gate — warn, never fail)
        shell: bash
        run: |
          # pure-Python size so it's identical on Git Bash (Windows) and Linux.
          # Report both variants; gate on the console bundle (the §7 artifact).
          size() { uv run python -c "import pathlib,sys; print(sum(f.stat().st_size for f in pathlib.Path(sys.argv[1]).rglob('*') if f.is_file()) // 1048576)" "$1"; }
          MB=$(size dist/fauxcasa-tracer)
          GUI_MB=$(size dist/fauxcasa-tracer-gui)
          echo "fauxcasa-tracer (console) bundle (${RUNNER_OS}): ${MB} MB; gui: ${GUI_MB} MB"
          echo "## fauxcasa-tracer bundle (${RUNNER_OS}): ${MB} MB console / ${GUI_MB} MB gui" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt 200 ]; then
            echo "::warning::bundle is ${MB} MB (over the 200 MB soft budget)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fauxcasa-tracer-${{ matrix.os }}
          path: dist/fauxcasa-tracer/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: fauxcasa-tracer-gui-${{ matrix.os }}
          path: dist/fauxcasa-tracer-gui/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: fauxcasa-tracer-${{ matrix.os }}-screenshot
          path: |
            frozen-ci.png
            gui-ci.png
          retention-days: 14
