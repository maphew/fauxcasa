<?xml version="1.0" encoding="UTF-8"?>
<!-- Application icon: "lens horizon". A cream lens/porthole on a teal
     rounded tile; through it, a warm sun over a green hill — a photo and
     a camera lens in one wordless mark (the app name is provisional, so
     no letters anywhere). Four flat colours, no strokes, no gradients:
     everything must survive 16x16. Geometry sits on a 16-unit grid
     (1 px at 16 px). Chosen from assets/icon-candidates/ (see the commit
     that added it); rasterize with assets/make-icons.py.

     Renderer note: QtSvg is an SVG Tiny renderer without clipPath, so the
     hill deliberately overflows the lens and the even-odd ring overlay
     (tile minus lens) paints the overflow back to the tile colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- tile -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="#1E7A82"/>
  <!-- lens -->
  <circle cx="128" cy="128" r="96" fill="#FFF7E8"/>
  <!-- sun -->
  <circle cx="160" cy="96" r="32" fill="#F0592E"/>
  <!-- hill (overflows the lens on purpose) -->
  <path d="M24,240 V186 C64,128 112,120 150,158 C174,182 204,186 232,172 V240 Z" fill="#3F9B6E"/>
  <!-- ring overlay: tile minus lens, masks the hill overflow -->
  <path fill="#1E7A82" fill-rule="evenodd"
        d="M52,0 H204 A52,52 0 0 1 256,52 V204 A52,52 0 0 1 204,256 H52 A52,52 0 0 1 0,204 V52 A52,52 0 0 1 52,0 Z
           M32,128 A96,96 0 1 0 224,128 A96,96 0 1 0 32,128 Z"/>
</svg>
